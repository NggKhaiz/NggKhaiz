# Install once, then forget it:
#
#     mkdir -p .github/workflows
#     cp tools/workflows/profile-data.yml .github/workflows/profile-data.yml
#
# GitHub Apps without the `workflows` permission cannot push into
# .github/workflows/, so this file travels here and is copied by hand (the same
# arrangement as tools/graph-art.workflow.yml).
#
# What it does, nightly: read the GitHub GraphQL API into data/profile.json,
# re-render README.md, the SVG cards and the site pages, and commit only if
# something actually changed. The build is deterministic, so a quiet day
# produces no commit.

name: profile data

on:
  schedule:
    # 04:17 ICT (21:17 UTC) — off the hour, so it is not queued behind everyone
    # else's cron.
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - ".github/workflows/profile-data.yml"

permissions:
  contents: write

concurrency:
  group: profile-data
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository_owner == 'NggKhaiz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build dependencies
        run: pip install --quiet pillow fonttools brotli

      - name: Fetch the numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/fetch_stats.py

      - name: Re-download the font sources (git-ignored cache)
        run: python3 tools/fetch_fonts.py

      - name: Re-render the SVG cards and the raster images
        run: |
          python3 tools/build_assets.py
          python3 tools/build_images.py

      - name: Re-render the pages and the README
        run: |
          python3 tools/build_pages.py
          python3 tools/build_readme.py

      - name: Commit, if the API actually moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — the numbers and the palette are current"
            exit 0
          fi
          git commit -m "chore: refresh profile data from the GitHub API"
          git push
